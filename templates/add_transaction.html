{% extends "base.html" %}

{% block title %}Add Transaction | Personal Finance Manager{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1>Add Transaction</h1>
        <p class="page-subtitle">
            Record a new income or expense.
        </p>
    </div>

    <a
        href="{{ url_for('transactions') }}"
        class="button secondary"
    >
        ← Back to Transactions
    </a>

</div>


<section class="form-card">

    <form method="POST" action="{{ url_for('add_transaction_page') }}">

        <div class="form-grid">

            <!-- Transaction Type -->

            <div class="form-group">

                <label for="type">
                    Transaction Type <span class="required">*</span>
                </label>

                <select
                    name="type"
                    id="type"
                    required
                >

                    <option value="">
                        Select Type
                    </option>

                    <option value="income">
                        Income
                    </option>

                    <option value="expense">
                        Expense
                    </option>

                </select>

            </div>


            <!-- Amount -->

            <div class="form-group">

                <label for="amount">
                    Amount <span class="required">*</span>
                </label>

                <input
                    type="number"
                    name="amount"
                    id="amount"
                    placeholder="Enter amount"
                    min="0.01"
                    step="0.01"
                    required
                >

            </div>


            <!-- Category -->

            <div class="form-group">

                <label for="category">
                    Category <span class="required">*</span>
                </label>

                <input
                    type="text"
                    name="category"
                    id="category"
                    placeholder="e.g. Food, Salary, Transport"
                    required
                >

            </div>


            <!-- Date -->

            <div class="form-group">

                <label for="date">
                    Date <span class="required">*</span>
                </label>

                <input
                    type="date"
                    name="date"
                    id="date"
                    value="{{ today }}"
                    required
                >

            </div>


            <!-- Description -->

            <div class="form-group full-width">

                <label for="description">
                    Description
                </label>

                <textarea
                    name="description"
                    id="description"
                    rows="4"
                    placeholder="Add a short description..."
                ></textarea>

            </div>

        </div>


        <!-- Form Actions -->

        <div class="form-actions">

            <a
                href="{{ url_for('transactions') }}"
                class="button secondary"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="button primary"
            >
                Save Transaction
            </button>

        </div>

    </form>

</section>

{% endblock %}
