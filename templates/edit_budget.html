{% extends "base.html" %}

{% block title %}Edit Budget | Personal Finance Manager{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1>Edit Budget</h1>

        <p class="page-subtitle">
            Update your spending limit.
        </p>
    </div>

    <a
        href="{{ url_for('budgets') }}"
        class="button secondary"
    >
        ← Back to Budgets
    </a>

</div>


<section class="form-card">

    <form
        method="POST"
        action="{{ url_for(
            'edit_budget_page',
            budget_id=budget.id
        ) }}"
    >

        <div class="form-grid">

            <!-- Category -->

            <div class="form-group">

                <label for="category">
                    Category
                    <span class="required">*</span>
                </label>

                <input
                    type="text"
                    name="category"
                    id="category"
                    value="{{ budget.category }}"
                    placeholder="e.g. Food, Travel, Shopping"
                    required
                >

            </div>


            <!-- Budget Amount -->

            <div class="form-group">

                <label for="amount">
                    Budget Amount
                    <span class="required">*</span>
                </label>

                <input
                    type="number"
                    name="amount"
                    id="amount"
                    value="{{ budget.amount }}"
                    min="0.01"
                    step="0.01"
                    required
                >

            </div>

        </div>


        <div class="form-actions">

            <a
                href="{{ url_for('budgets') }}"
                class="button secondary"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="button primary"
            >
                Update Budget
            </button>

        </div>

    </form>

</section>

{% endblock %}
